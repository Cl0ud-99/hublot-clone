<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <title>Hublot — WebGL Clone</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #ccc;
        font: 12px/1.4 system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      /* 舷窗暗角：先用手写的 CSS 叠加，M5 换真几何后可移除 */
      #vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        background: radial-gradient(
          ellipse 78% 92% at 50% 50%,
          rgba(0, 0, 0, 0) 40%,
          rgba(0, 0, 0, 0.35) 72%,
          rgba(0, 0, 0, 0.72) 100%
        );
        transition: opacity 0.4s ease;
      }
      #hud {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 3;
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 11px;
        letter-spacing: 0.02em;
      }
      #hud .chip {
        padding: 5px 9px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(8px);
        white-space: nowrap;
      }
      #hud .chip.warn {
        color: #ffb4a2;
      }
      #hud .chip b {
        color: #fff;
        font-weight: 600;
      }
      #fallback {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #888;
        font-size: 13px;
        padding: 24px;
        text-align: center;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="vignette"></div>
    <div id="hud">
      <div class="chip" id="chip-fps">-- fps</div>
      <div class="chip" id="chip-scale">dpr --</div>
      <div class="chip" id="chip-time">--</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
